# Nixpacks configuration for Railway
# This tells Railway how to build the server

[variables]
NIXPACKS_INSTALL_CMD = "cd server && npm ci"

[phases.setup]
# nodejs_22 bundles npm 10, so npm is no longer listed separately.
nixPkgs = ["nodejs_22", "python3", "make", "gcc"]

# Install dependencies in server directory
[phases.install]
cmds = [
  "cd server && npm ci"
]

# Start command
[start]
cmd = "cd server && npm start"

