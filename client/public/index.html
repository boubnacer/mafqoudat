<!DOCTYPE html>
<!--
  lang="ar" dir="rtl", not "en".

  languageContext's resolveLanguage() returns 'ar' for anyone with no stored
  preference, which is every first-time visitor and every crawler. The shell
  used to declare English while rendering Arabic, and since this file is also
  the SPA fallback for every route without a build-time file of its own, that
  wrong declaration was what most of the site served on its first byte.
  scripts/prerenderSeo.js rewrites this tag per route, and applyDocumentLanguage
  updates it at runtime once a preference is known.
-->
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <!--
      Favicons for Google Search Results.

      Every size below used to point at favicon.png, which was a copy of the
      1808x2048 transparent splash artwork. That made each of these a 591KB
      download the browser then squeezed into a non-square box - and Google's
      search-results favicon needs a square image, which it never was. The
      apple-touch-icon had the same file, so an iOS home-screen shortcut got
      transparency painted black behind a squashed logo.

      These are now real square renders of the brand glyph, the same mark the
      mobile app icons use, at the size each slot actually asks for.
    -->
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="%PUBLIC_URL%/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="%PUBLIC_URL%/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="%PUBLIC_URL%/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="%PUBLIC_URL%/icon-512.png" />
    <link rel="icon" type="image/x-icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/maficonSVG.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <!--
      data-rh="true" on the tags below is load-bearing, not decoration.

      These are generic fallbacks so that clients which never run JavaScript
      (social scrapers in particular) still get something sane. Once React
      mounts, SeoMeta re-renders all of them with page-specific values via
      react-helmet-async - but Helmet only ever removes tags it can recognise
      as its own: its updateTags() selects `meta[data-rh]` and deletes what is
      no longer current. A tag without the attribute is invisible to it and
      survives forever, so the generic value stayed in the document alongside
      the page-specific one. Two <meta name="description">, and on post pages
      two conflicting og:image (site logo vs the item's photo).

      Marking them hands ownership to Helmet: it reuses a tag when the value is
      identical and replaces it otherwise, so exactly one of each survives.
      Do NOT add this attribute to the JSON-LD blocks further down - SeoMeta
      never re-renders those site-wide schemas, so Helmet would delete them.
    -->
    <meta name="description" content="منصة المفقودات في الوطن العربي (المغرب، الخليج، مصر وكافة الدول العربية). أعلن مجاناً وساعد في إعادة الأمانات لأصحابها." data-rh="true" />
    <!--
      There is deliberately no keywords meta tag here. Google has ignored that
      tag since 2009, and what sat here was ~60 brand misspellings and repeated
      intent phrases - a signal no engine reads, in the one shape they all
      recognise as stuffing.

      (Written out in prose rather than shown as markup on purpose: the build's
      prerender rewrites tags in this file by regex, and a tag quoted inside a
      comment is indistinguishable from a real one to those patterns. That is
      exactly how the description meta below went unrewritten for every
      prerendered route - see setDescription in scripts/prerenderSeo.js.)
    -->
    <meta name="author" content="Mafqoudat Team" />
    <meta name="robots" content="index, follow" data-rh="true" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!-- Google Ownership & AdSense Verification (populated at build time by scripts/postbuild.js) -->
    <!-- GOOGLE_SITE_VERIFICATION_PLACEHOLDER -->
    <!-- ADSENSE_VERIFICATION_PLACEHOLDER -->
    <!-- Canonical URL is set dynamically - this script ensures it's set immediately for SEO.
         Tagged data-rh so SeoMeta's canonical replaces this one instead of the
         document ending up with two competing rel=canonical links. -->
    <script>
      (function() {
        var path = window.location.pathname;
        var canonical = document.createElement('link');
        canonical.setAttribute('rel', 'canonical');
        canonical.setAttribute('href', 'https://www.mafqoudat.com' + path);
        canonical.setAttribute('data-rh', 'true');
        document.head.appendChild(canonical);
      })();
    </script>

    <!-- Open Graph / Facebook Meta Tags -->
    <!-- These are set dynamically by SeoMeta component for each page -->
    <meta property="og:type" content="website" data-rh="true" />
    <meta property="og:site_name" content="Mafqoudat" data-rh="true" />
    <meta property="og:image" content="https://www.mafqoudat.com/maflogo1200-630.png?v=2" data-rh="true" />
    <!-- The og:image:* siblings describe the logo above. SeoMeta renders an
         og:image but no dimensions (a post's Cloudinary height isn't known),
         so these are tagged too: Helmet drops them rather than leaving the
         logo's 1200x630 and alt text attached to an item photo. -->
    <meta property="og:image:secure_url" content="https://www.mafqoudat.com/maflogo1200-630.png?v=2" data-rh="true" />
    <meta property="og:image:type" content="image/png" data-rh="true" />
    <meta property="og:image:width" content="1200" data-rh="true" />
    <meta property="og:image:height" content="630" data-rh="true" />
    <meta property="og:image:alt" content="Mafqoudat - Lost and Found Platform" data-rh="true" />
    <meta name="twitter:card" content="summary_large_image" data-rh="true" />
    <meta name="twitter:image" content="https://www.mafqoudat.com/maflogo1200-630.png?v=2" data-rh="true" />
    <meta property="og:locale" content="en_US" data-rh="true" />
    <meta property="og:locale:alternate" content="ar_AR" data-rh="true" />
    <meta property="og:locale:alternate" content="fr_FR" data-rh="true" />

    <!--
      The Cache-Control / Pragma / Expires <meta http-equiv> trio that used to
      sit here is gone. Browsers ignore http-equiv cache directives (only real
      HTTP response headers count, which Vercel already sets), so it never
      busted any cache - but crawlers do read the head, and a document
      announcing no-store on every route is a poor signal on a page you want
      indexed and kept. Cache headers belong in vercel.json's headers block.
    -->

    <title>مفقودات | منصة المفقودات في جميع الدول العربية</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Design system fonts: Cairo (display) + IBM Plex Sans Arabic (body) -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet" />
    </noscript>

    <!--
      Facebook Pixel used to load here unconditionally - fbq('init'...) and
      fbq('track', 'PageView') fired on first byte, before the Consent Mode
      defaults below were even set and with no dependency on the CMP's answer.
      That undermined the whole point of having a certified CMP with
      denied-by-default consent for everything else. It now lives in
      src/utils/metaPixel.js, requested only after utils/consent.js reports ad
      consent (ad_storage + ad_user_data granted) - same pattern as gtag.js
      below. The noscript fallback pixel is not reproduced: there is no way to
      gate a <noscript> tag on a JS-read consent signal, and the tradeoff here
      mirrors the rest of this consent setup - no tracking fires without an
      answer, even at the cost of the non-JS fallback.
    -->

    <!--
      Consent management (Google Funding Choices / "Privacy & messaging") and
      the Google Analytics gate.

      What used to sit here was the gtag.js snippet, loaded unconditionally on
      every page: the GA cookie was written before the visitor had been asked
      anything. Google requires a certified CMP before ads can be served to
      EEA/UK visitors, and this site's diaspora traffic makes that a real share
      of visitors, so consent now comes first and GA follows it.

      Three things happen here, in order, and the order is load-bearing:

      1. Consent Mode v2 defaults, denied. These have to be in the dataLayer
         before any Google tag reads it, which is why they are inline in the
         head rather than in the bundle. Nothing about them loads GA - they are
         the standing answer any Google tag gets until the CMP says otherwise.
      2. The Funding Choices loader, as early as possible so the message can be
         shown before the page settles.
      3. Nothing else. gtag.js itself is no longer requested from this document
         at all; src/utils/analytics.js loads it, and only after
         src/utils/consent.js reports analytics consent. "No signal" is treated
         as "no consent", so a build with no publisher ID configured, or a
         visitor whose CMP request is blocked, gets no analytics rather than
         analytics with no consent behind it.
    -->
    <script>
      (function () {
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        window.gtag = window.gtag || gtag;

        // wait_for_update gives the CMP a window to answer before any tag that
        // did load acts on the default; ads_data_redaction keeps ad click
        // identifiers out of requests for as long as ad_storage is denied.
        gtag('consent', 'default', {
          ad_storage: 'denied',
          ad_user_data: 'denied',
          ad_personalization: 'denied',
          analytics_storage: 'denied',
          wait_for_update: 2000
        });
        gtag('set', 'ads_data_redaction', true);
      })();
    </script>
    <script>
      (function () {
        // Replaced at build time by scripts/postbuild.js from
        // REACT_APP_FC_PUBLISHER_ID. Left as the placeholder when that variable
        // is not set, which this guard reads as "no CMP configured" - the
        // script is then never requested (a request for the literal
        // placeholder would only 404) and consent.js resolves to denied.
        var publisherId = 'FC_PUBLISHER_ID_PLACEHOLDER'.replace(/^ca-/, '');

        if (!publisherId || publisherId.indexOf('PLACEHOLDER') !== -1) {
          window.__MAFQ_CMP_CONFIGURED__ = false;
          return;
        }
        window.__MAFQ_CMP_CONFIGURED__ = true;

        var script = document.createElement('script');
        script.async = true;
        script.src = 'https://fundingchoicesmessages.google.com/i/' + publisherId + '?ers=1';
        (document.head || document.documentElement).appendChild(script);

        // Google's own ad-block detection ping, verbatim from their snippet:
        // the presence of this named frame is how fundingchoicesmessages.google.com
        // learns the script was not blocked.
        (function signalGooglefcPresent() {
          if (!window.frames['googlefcPresent']) {
            if (document.body) {
              var iframe = document.createElement('iframe');
              iframe.style = 'width:0;height:0;border:none;z-index:-1000;left:-1000px;top:-1000px;';
              iframe.style.display = 'none';
              iframe.name = 'googlefcPresent';
              document.body.appendChild(iframe);
            } else {
              setTimeout(signalGooglefcPresent, 0);
            }
          }
        })();
      })();
    </script>
    <!--
      The consent message is Google's markup, not ours, and it renders into this
      document before React has mounted - so the only way it can know which of
      the two themes it is being drawn on is an attribute set here, from the
      same localStorage key the Redux global slice persists mode to. App.js
      keeps it in sync afterwards (applyDocumentTheme), and
      styles/consentMessage.css is what reads it.
    -->
    <script>
      (function () {
        var mode = 'light';
        try {
          var stored = JSON.parse(window.localStorage.getItem('globalState') || '{}');
          if (stored && stored.mode === 'dark') {
            mode = 'dark';
          }
        } catch (error) {
          /* private mode, or a corrupt value - light is the app's own default */
        }
        document.documentElement.setAttribute('data-color-scheme', mode);
      })();
    </script>

    <!--
      Structured Data.

      alternateName is a short list on purpose. It used to carry ~34 entries:
      every transliteration of the brand (mafgod, maf9oudat, mafodat...) plus
      bare Arabic nouns that are not names of anything - فقد, ضياع, وجد. An
      alternateName is for names the entity is genuinely also known by; a list
      of misspellings and topic words is a keyword list wearing a schema tag,
      and it earns nothing for queries the site does not already win. What is
      left is the brand in both scripts and the two transliterations people
      actually type.
    -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Mafqoudat",
      "alternateName": [
        "مفقودات",
        "منصة مفقودات",
        "Mafqudat",
        "Mafkoudat"
      ],
      "description": "منصة المفقودات في الوطن العربي (المغرب، الخليج، مصر وكافة الدول العربية)",
      "inLanguage": ["ar", "fr", "en"],
      "url": "https://www.mafqoudat.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://www.mafqoudat.com/dash/posts?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
