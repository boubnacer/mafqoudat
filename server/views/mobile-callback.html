<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signing you in…</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
            background: #F7F8FB;
            color: #0B1220;
            text-align: center;
        }
        @media (prefers-color-scheme: dark) {
            body { background: #0E1116; color: #EDEFF5; }
        }
        .spinner {
            width: 38px;
            height: 38px;
            border: 3px solid rgba(27, 77, 255, 0.18);
            border-top-color: #1B4DFF;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 18px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        p { font-size: 15px; font-weight: 500; }
        /* Manual escape hatch, revealed only if the automatic redirect hasn't
           taken effect - some in-app browsers refuse scheme redirects. */
        #fallback {
            display: none;
            margin-top: 22px;
            font-size: 14px;
        }
        #fallback a {
            display: inline-block;
            margin-top: 10px;
            padding: 12px 26px;
            background: #1B4DFF;
            color: #FFFFFF;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
        }
        #error { display: none; font-size: 15px; font-weight: 500; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <p>Signing you in…</p>
    </div>

    <p id="error"></p>

    <div id="fallback">
        <p>Not redirected automatically?</p>
        <a id="fallbackLink" href="#">Return to Mafqoudat</a>
    </div>

    <!-- External file, not inline: the site-wide CSP (server/middleware/securityHeaders.js)
         sets script-src 'self' with no 'unsafe-inline', which silently blocks inline <script>
         blocks and inline onclick= handlers alike. A same-origin src= file is allowed by
         'self' without weakening the CSP for the rest of the site. -->
    <script src="/js/mobile-callback.js"></script>
</body>
</html>
