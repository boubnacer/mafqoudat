services:
  - type: web
    name: mafqoudat-backend
    env: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # --- Core server config ---
      # Node 18 and 20 are both past end-of-life (Apr 2025 / Apr 2026), so they
      # no longer receive runtime security patches. 22 is in maintenance until
      # Apr 2027. Also the floor for sharp >= 0.35, which carries the libvips
      # CVE fixes. server/.node-version pins the same value for anything that
      # reads that instead.
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=400 --expose-gc
      - key: NODE_NO_WARNINGS
        value: "1"
      # PORT is auto-injected by Render, declared here to match the app's default
      - key: PORT
        value: 10000

      # --- Database (MongoDB Atlas) ---
      - key: MONGODB_URI
        sync: false

      # --- Auth / JWT ---
      - key: JWT_SECRET
        sync: false
      # Short-lived on purpose; sessions outlive this via the refresh-token
      # flow. Do NOT set to 30d - that's the pre-refresh-token era and
      # defeats fast logout/role-change revocation.
      - key: JWT_ACCESS_EXPIRES_IN
        value: 30m

      # --- CORS / frontend linkage (Vercel) ---
      - key: FRONTEND_URL
        value: https://mafqoudat.com
      - key: CLIENT_URL
        value: https://mafqoudat.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # --- Google OAuth ---
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Set to: https://mafqoudat-api.onrender.com/auth/google/callback
      - key: GOOGLE_CALLBACK_URL
        sync: false
      # Native mobile Google OAuth clients (iOS/Android), accepted alongside
      # GOOGLE_CLIENT_ID when verifying mobile ID tokens.
      - key: GOOGLE_IOS_CLIENT_ID
        sync: false
      - key: GOOGLE_ANDROID_CLIENT_ID
        sync: false

      # --- Google Places (city autocomplete) ---
      - key: GOOGLE_PLACES_API_KEY
        sync: false

      # --- GeoNames (city autocomplete) ---
      - key: GEONAMES_USERNAME
        sync: false
      - key: GEONAMES_API_URL
        value: http://api.geonames.org

      # --- Cloudinary (image storage) ---
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # --- Email (Nodemailer / Gmail) ---
      - key: ADMIN_EMAIL
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: EMAIL_SERVICE
        value: gmail
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false

      # --- Redis (optional - omit/leave unset to use in-memory cache only) ---
      - key: REDIS_URL
        sync: false

      # --- Push notifications ---
      # Browser (Web Push) alerts. WITHOUT BOTH KEYS NO BROWSER EVER RECEIVES A
      # NOTIFICATION - the client asks for the public key, gets an empty string,
      # never offers to subscribe, and the server never sends. That failure is
      # silent by design (a push must never cost a match, a comment or a
      # publish), so the server states it at boot and `npm run doctor-push`
      # reports it on demand. Generate the pair ONCE and keep it - every browser
      # subscription is bound to the public key that created it:
      #   cd server && node -e "console.log(require('web-push').generateVAPIDKeys())"
      # Full walkthrough: docs/web-push.md
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      # mailto: or https: URL naming whoever operates the site; push services
      # use it to reach a human about abusive sending.
      - key: VAPID_SUBJECT
        value: mailto:contact@mafqoudat.com
      # Device (Expo) alerts for the mobile app. Optional: sends work without
      # it, but it stops anyone holding a scraped push token sending as this
      # project. See mobile/PUSH_NOTIFICATIONS.md.
      - key: EXPO_ACCESS_TOKEN
        sync: false

      # --- Misc ---
      - key: MAINTENANCE_MODE
        value: "false"
